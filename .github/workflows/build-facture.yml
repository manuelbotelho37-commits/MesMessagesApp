name: Build Facture APK

on:
  push:
    branches: [ facture-build-20260922 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: facture-build-20260922

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Facture signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: facture-debug-signing-v2

      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore /home/runner/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Facture Android, OU=Mobile, O=Manuel Botelho, L=Tours, ST=Centre-Val de Loire, C=FR"
          fi

      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Facture-1.0.apk
          sha256sum Facture-1.0.apk > Facture-1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Facture-1.0-final
          path: |
            Facture-1.0.apk
            Facture-1.0.sha256
