name: Build MNM 2.26 Verified

on:
  push:
    branches: [ main ]
    paths:
      - 'mnm226final/source.b64.*'
      - '.github/workflows/build-mnm-226.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Rebuild and check source archive
        run: |
          rm -rf mnm226final/work mnm226final/MNM-2.26-SOURCE.zip
          cat mnm226final/source.b64.* | tr -d '\n\r ' | base64 -d > mnm226final/MNM-2.26-SOURCE.zip
          test "$(stat -c%s mnm226final/MNM-2.26-SOURCE.zip)" = "60787"
          echo "3ed6e2db371bc24c29640127d4136feaae4ebed77d22fb17b3ad9b6f83c5e609  mnm226final/MNM-2.26-SOURCE.zip" | sha256sum -c -
          unzip -t mnm226final/MNM-2.26-SOURCE.zip
          mkdir -p mnm226final/work
          unzip -q mnm226final/MNM-2.26-SOURCE.zip -d mnm226final/work
          test -f mnm226final/work/app/build.gradle
          test -f mnm226final/work/.signing/mnm-release-2026.p12

      - name: Build signed release APK
        working-directory: mnm226final/work
        run: gradle --no-daemon assembleRelease

      - name: Verify update compatibility
        run: |
          APK=mnm226final/work/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='fr.manubotelho.mesnotes'" /tmp/badging.txt
          grep -q "versionCode='48'" /tmp/badging.txt
          grep -q "versionName='2.26'" /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/signing.txt
          DIGEST=$(grep -i "certificate SHA-256 digest" /tmp/signing.txt | head -1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$DIGEST" = "4523be024571af41dd20f4219fe705b440f415c6685f511c4f87f782e619e61d"
          mkdir -p output
          cp "$APK" output/MNM-2.26-MISE-A-JOUR.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MNM-2.26-MISE-A-JOUR
          path: output/MNM-2.26-MISE-A-JOUR.apk
          if-no-files-found: error

      - name: Export verified APK for retrieval
        run: |
          rm -rf mnm226final/result
          mkdir -p mnm226final/result
          base64 -w 0 output/MNM-2.26-MISE-A-JOUR.apk > /tmp/mnm226-apk.b64
          split -b 500000 -d -a 2 /tmp/mnm226-apk.b64 mnm226final/result/apk.b64.
          sha256sum output/MNM-2.26-MISE-A-JOUR.apk | awk '{print $1}' > mnm226final/result/APK-SHA256.txt
          printf 'MNM-2.26-MISE-A-JOUR.apk\nversionCode=48\nversionName=2.26\npackage=fr.manubotelho.mesnotes\nverified=true\n' > mnm226final/result/VERIFIED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mnm226final/result
          git commit -m "MNM 2.26 verified APK result"
          git push
