name: Export JADX Temporary
on:
  push:
    branches: [ main ]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download JADX
        run: |
          curl -L --fail --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
      - name: Upload JADX
        uses: actions/upload-artifact@v4
        with:
          name: jadx-tool-temp
          path: jadx.zip
          retention-days: 1
