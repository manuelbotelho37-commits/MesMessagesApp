plugins { id 'com.android.application' }

android {
    namespace 'com.mesmessages.app'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/facture.keystore')
            storePassword 'Facture2026MB'
            keyAlias 'facture'
            keyPassword 'Facture2026MB'
        }
    }

    defaultConfig {
        applicationId 'fr.manubotelho.facture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
