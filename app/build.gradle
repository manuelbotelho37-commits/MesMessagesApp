plugins { id 'com.android.application' }

android {
    namespace 'com.mesmessages.app'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/insisto.keystore')
            storePassword 'Insisto2026'
            keyAlias 'insisto'
            keyPassword 'Insisto2026'
        }
    }

    defaultConfig {
        applicationId 'com.insisto.manuel'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5.0-insisto'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
