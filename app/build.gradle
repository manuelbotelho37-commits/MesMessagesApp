plugins { id 'com.android.application' }

android {
    namespace 'com.messageclient.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.messageclient.manuel.stable'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '2.0.0'
    }

    signingConfigs {
        stable {
            def keyPath = System.getenv("MESSAGE_CLIENT_KEYSTORE")
            if (keyPath != null && !keyPath.isEmpty()) {
                storeFile file(keyPath)
            }
            storePassword 'android'
            keyAlias 'message-client-stable'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
