plugins { id 'com.android.application' }

android {
    namespace 'com.mesmessages.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mesmessages.contactsfix'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.2-contacts'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
