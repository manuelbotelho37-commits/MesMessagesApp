plugins { id 'com.android.application' }

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

android {
    namespace 'fr.manubotelho.mestaches'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.manubotelho.mestaches'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '2.2-ecran-verrouille'
    }
    signingConfigs {
        release {
            if (System.getenv('TASKS_KEYSTORE')) {
                storeFile file(System.getenv('TASKS_KEYSTORE'))
                storePassword 'android'
                keyAlias 'mes-taches'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}

tasks.withType(Test).configureEach {
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}
